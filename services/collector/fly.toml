app = "metrics-collector-freddy"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8002"

[http_service]
  internal_port = 8002
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
