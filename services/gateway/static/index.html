<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevStack Metrics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ---------- LOGIN ---------- */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 2.5rem;
      width: 360px;
    }

    .login-card h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .login-card p {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
    }

    .field { margin-bottom: 1rem; }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: #6366f1; }

    .btn {
      width: 100%;
      padding: 0.65rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #3730a3; cursor: not-allowed; }

    #login-error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* ---------- DASHBOARD ---------- */
    #dashboard { display: none; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid #1e2235;
      background: #1a1d27;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    #ws-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .dot.connected { background: #34d399; }
    .dot.disconnected { background: #f87171; }

    #logout-btn {
      background: none;
      border: 1px solid #2d3148;
      color: #94a3b8;
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    #logout-btn:hover { border-color: #6366f1; color: #e2e8f0; }

    main { padding: 2rem; }

    .node-selector {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .node-selector label { font-size: 0.85rem; color: #94a3b8; }

    .node-selector select {
      background: #1a1d27;
      border: 1px solid #2d3148;
      color: #e2e8f0;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .chart-card {
      background: #1a1d27;
      border: 1px solid #1e2235;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .chart-card h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 0.25rem;
    }

    .chart-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .chart-value span { font-size: 1rem; color: #94a3b8; }

    canvas { max-height: 120px; }

    #no-nodes {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 2rem;
      display: none;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>DevStack Metrics</h1>
    <p>Sign in to view your dashboard</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <button class="btn" id="login-btn">Sign in</button>
    <div id="login-error">Invalid username or password.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <h1>DevStack Metrics</h1>
    <div class="header-right">
      <div id="ws-status">
        <div class="dot disconnected" id="ws-dot"></div>
        <span id="ws-label">Disconnected</span>
      </div>
      <button id="logout-btn">Sign out</button>
    </div>
  </header>

  <main>
    <div class="node-selector">
      <label for="node-select">Node</label>
      <select id="node-select"></select>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h3>CPU Usage</h3>
        <div class="chart-value" id="cpu-value">—<span>%</span></div>
        <canvas id="cpu-chart"></canvas>
      </div>
      <div class="chart-card">
        <h3>RAM Usage</h3>
        <div class="chart-value" id="ram-value">—<span>%</span></div>
        <canvas id="ram-chart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Disk Usage</h3>
        <div class="chart-value" id="disk-value">—<span>%</span></div>
        <canvas id="disk-chart"></canvas>
      </div>
    </div>

    <p id="no-nodes">No nodes registered yet. Register a node via the API to start seeing metrics.</p>
  </main>
</div>

<script>
const BASE = window.location.origin;
const WS_URL = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws/metrics";
const MAX_POINTS = 30;

let selectedNodeId = null;
let ws = null;
let wsReconnectTimer = null;

// ---------- Charts ----------
function makeChart(id, color) {
  const ctx = document.getElementById(id).getContext("2d");
  return new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderColor: color,
        backgroundColor: color + "22",
        borderWidth: 2,
        pointRadius: 0,
        fill: true,
        tension: 0.4,
      }]
    },
    options: {
      animation: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: {
          min: 0, max: 100,
          ticks: { color: "#94a3b8", font: { size: 10 } },
          grid: { color: "#1e2235" },
        }
      }
    }
  });
}

const charts = {
  cpu: makeChart("cpu-chart", "#6366f1"),
  ram: makeChart("ram-chart", "#34d399"),
  disk: makeChart("disk-chart", "#f59e0b"),
};

function pushPoint(chart, value) {
  const ts = new Date().toLocaleTimeString();
  chart.data.labels.push(ts);
  chart.data.datasets[0].data.push(value);
  if (chart.data.labels.length > MAX_POINTS) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }
  chart.update("none");
}

function updateValues(cpu, ram, disk) {
  document.getElementById("cpu-value").innerHTML = cpu.toFixed(1) + '<span>%</span>';
  document.getElementById("ram-value").innerHTML = ram.toFixed(1) + '<span>%</span>';
  document.getElementById("disk-value").innerHTML = disk.toFixed(1) + '<span>%</span>';
  pushPoint(charts.cpu, cpu);
  pushPoint(charts.ram, ram);
  pushPoint(charts.disk, disk);
}

// ---------- WebSocket ----------
function setWsStatus(connected) {
  const dot = document.getElementById("ws-dot");
  const label = document.getElementById("ws-label");
  dot.className = "dot " + (connected ? "connected" : "disconnected");
  label.textContent = connected ? "Live" : "Disconnected";
}

function connectWs() {
  if (ws) ws.close();
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setWsStatus(true);
    clearTimeout(wsReconnectTimer);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.node_id === selectedNodeId) {
      updateValues(msg.cpu_pct, msg.ram_pct, msg.disk_pct);
    }
  };

  ws.onclose = () => {
    setWsStatus(false);
    wsReconnectTimer = setTimeout(connectWs, 3000);
  };

  ws.onerror = () => ws.close();
}

// ---------- API ----------
async function apiFetch(path, opts = {}) {
  const res = await fetch(BASE + path, {
    credentials: "include",
    headers: { "Content-Type": "application/json", ...opts.headers },
    ...opts,
  });
  return res;
}

async function getCsrf() {
  // Extract CSRF token from cookie
  const match = document.cookie.match(/csrftoken=([^;]+)/);
  return match ? match[1] : "";
}

async function loadNodes() {
  const res = await apiFetch("/api/admin/nodes/");
  if (!res.ok) return;
  const nodes = await res.json();
  const select = document.getElementById("node-select");
  select.innerHTML = "";
  if (nodes.length === 0) {
    document.getElementById("no-nodes").style.display = "block";
    return;
  }
  document.getElementById("no-nodes").style.display = "none";
  nodes.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n.id;
    opt.textContent = n.label + " (" + n.hostname + ")";
    select.appendChild(opt);
  });
  selectedNodeId = nodes[0].id;
}

// ---------- Login ----------
document.getElementById("login-btn").addEventListener("click", async () => {
  const btn = document.getElementById("login-btn");
  const err = document.getElementById("login-error");
  btn.disabled = true;
  err.style.display = "none";

  const res = await apiFetch("/api/admin/auth/login/", {
    method: "POST",
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    }),
  });

  if (res.ok) {
    showDashboard();
  } else {
    err.style.display = "block";
    btn.disabled = false;
  }
});

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

// ---------- Logout ----------
document.getElementById("logout-btn").addEventListener("click", async () => {
  const csrf = await getCsrf();
  await apiFetch("/api/admin/auth/logout/", {
    method: "POST",
    headers: { "X-CSRFToken": csrf },
  });
  if (ws) ws.close();
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
});

// ---------- Node selector ----------
document.getElementById("node-select").addEventListener("change", e => {
  selectedNodeId = e.target.value;
});

// ---------- Init ----------
async function showDashboard() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  await loadNodes();
  connectWs();
}

// Check if already logged in
(async () => {
  const res = await apiFetch("/api/admin/auth/me/");
  if (res.ok) {
    showDashboard();
  }
})();
</script>
</body>
</html>
