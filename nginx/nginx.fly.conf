events {
    worker_connections 1024;
}

http {
    resolver [fdaa::3] valid=15s;

    server {
        listen 80;

        # Django static files
        location /static/ {
            set $admin "http://metrics-admin-freddy.internal:8001";
            proxy_pass $admin;
            proxy_set_header Host $host;
        }

        # Django admin panel and auth
        location /admin/ {
            set $admin "http://metrics-admin-freddy.internal:8001";
            proxy_pass $admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Django API (key management, node CRUD)
        location /api/admin/ {
            set $admin "http://metrics-admin-freddy.internal:8001";
            proxy_pass $admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Flask metrics ingestion
        location /api/v1/metrics {
            set $collector "http://metrics-collector-freddy.internal:8002";
            proxy_pass $collector;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI WebSocket
        location /ws/ {
            set $gateway "http://metrics-gateway-freddy.internal:8000";
            proxy_pass $gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # FastAPI — everything else (dashboard, health)
        location / {
            set $gateway "http://metrics-gateway-freddy.internal:8000";
            proxy_pass $gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
